<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141226"/>
      <stop offset="100%" stop-color="#040409"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffd9a8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#b9a8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
  <!-- Orbiting stardust rings -->
  <g filter="url(#glow)">
    <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="#b9a8ff" stroke-width="1.2" stroke-dasharray="3 7 1 9" transform="rotate(-30 64 64)" opacity="0.75"/>
    <ellipse cx="64" cy="64" rx="38" ry="14" fill="none" stroke="#ffd9a8" stroke-width="1" stroke-dasharray="2 5" transform="rotate(25 64 64)" opacity="0.65"/>
    <ellipse cx="64" cy="64" rx="26" ry="9" fill="none" stroke="#818cf8" stroke-width="1.4" transform="rotate(-70 64 64)" opacity="0.8"/>
  </g>
  <!-- Constellation / Living Particles -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="64" cy="64" r="8" fill="url(#coreGlow)"/>
    <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
    <circle cx="34" cy="48" r="1.8" fill="#ffd9a8" opacity="0.9"/>
    <circle cx="92" cy="76" r="2.2" fill="#ffd9a8" opacity="0.9"/>
    <circle cx="78" cy="38" r="1.5" fill="#b9a8ff" opacity="0.85"/>
    <circle cx="48" cy="88" r="1.7" fill="#b9a8ff" opacity="0.85"/>
    <circle cx="86" cy="50" r="1.4" fill="#ffffff" opacity="0.9"/>
    <circle cx="40" cy="74" r="1.2" fill="#ffffff" opacity="0.75"/>
    <circle cx="60" cy="28" r="1.6" fill="#ffd9a8" opacity="0.8"/>
    <circle cx="68" cy="98" r="1.5" fill="#818cf8" opacity="0.85"/>
    <circle cx="102" cy="62" r="1.3" fill="#b9a8ff" opacity="0.7"/>
    <circle cx="24" cy="64" r="1.2" fill="#818cf8" opacity="0.7"/>
    <circle cx="52" cy="56" r="1.4" fill="#ffffff" opacity="0.95"/>
    <circle cx="76" cy="70" r="1.5" fill="#ffd9a8" opacity="0.95"/>
  </g>
</svg>
